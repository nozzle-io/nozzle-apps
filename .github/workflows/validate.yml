name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Python dependencies
        run: python3 -m pip install pyyaml
      - name: Validate apps manifest
        run: python3 scripts/validate-apps-manifest.py apps.yml
      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py
      - name: Permission preservation regression
        run: python3 scripts/test-permission-preservation.py
