name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned core ISA checker
        uses: actions/checkout@v4
        with:
          repository: nozzle-io/nozzle
          ref: 79637d4b25b13b1d7ab5751ccc7d0a0e14bc808e
          path: build/isa-checker
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Python dependencies
        run: python3 -m pip install pyyaml
      - name: Validate apps manifest
        run: python3 scripts/validate-apps-manifest.py apps.yml
      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py
      - name: Permission preservation regression
        run: python3 scripts/test-permission-preservation.py
      - name: Final Linux archive ISA regression
        timeout-minutes: 5
        run: python3 scripts/test-final-archive-isa.py --isa-checker-root build/isa-checker
